name: Demo CI Env Secrets

on:
    # push:
    workflow_dispatch:

env:
    GLOBAL_APP_ENV: globalappenvdemo

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            JOB_ENV: jobenvdemo

        steps:
            - name: say hello
              run: echo "Hello, World!"

            - name: install
              env:
                APP_ENV: demo
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "Env $APP_ENV using secret $DB_PASSWORD and global env $GLOBAL_APP_ENV and job env $JOB_ENV"

