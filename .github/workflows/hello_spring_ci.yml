name: Hello Spring Boot App 1 to Docker

on:
    push:
    # workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            
            - name: Build and Test (Maven)
              working-directory: docker/app1-hello/springboot/hello-spring
              run: mvn -B clean verify

            - name: Upload test reports
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: docker/app1-hello/springboot/hello-spring/target/surefire-reports


    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v3
              with:
                  distribution: temurin
                  java-version: 21
            
            - name: Build jar for Docker
              run: mvn clean install

            - name: login Dockerhub
              run: |

            - name: Build and Push Docker Image
              run: |

