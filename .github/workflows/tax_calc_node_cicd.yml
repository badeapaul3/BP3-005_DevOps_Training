name: Tax Calc Node CICD AWS EKS

on:
    # push:
    workflow_dispatch:

# build and test, docker build and push, deploy to EKS
#Matrix strategy for different services (service-a, service-b, service-c) and different environments (dev, staging, prod), different branches (main, develop, feature/*)
# different services can have different build and test steps, different docker build and push steps, different deploy steps


jobs:
    build-test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [service-a, service-b]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26

            - name: Install dependencies
              working-directory: docker/app2-tax-calculator/node/${{ matrix.service }}
              run: npm ci

            - name: Run tests (if any)
              working-directory: docker/app2-tax-calculator/node/${{ matrix.service }}
              run: npm test --if-present



    docker-build-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: 
                    - { name: "service-a", docker_name: "tax-service-a", path: "docker/app2-tax-calculator/node/service-a" }
                    - { name: "service-b", docker_name: "tax-service-b", path: "docker/app2-tax-calculator/node/service-b" }
        needs: build-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: login Dockerhub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.service.path }}
                  push: true
                  tags: |
                    ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.docker_name }}:nodelatest

    deploy-aws-eks:
        runs-on: ubuntu-latest
        needs: docker-build-push
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5.1.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1
            
            - name: Set up kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: 'latest'

            - name: Update kubeconfig for EKS cluster
              run: |
                aws eks update-kubeconfig --name hello-cluster --region us-east-1
              
            - name: Verify connection to EKS cluster
              run: kubectl get nodes

            - name: Deploy to AWS EKS
              run: |
                kubectl apply -f k8s/aws/app2-tax-calculator/service-a
                kubectl apply -f k8s/aws/app2-tax-calculator/service-b
                  


